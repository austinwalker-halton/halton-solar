<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halton Outdoor Centre - Project Zero Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f4f6f8;
      color: #0b2b3c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 50px 60px;
      overflow: hidden;
    }
    
    /* Header Section */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 30px 45px;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(11, 43, 60, 0.08);
      border-left: 14px solid #88c542;
    }
    .header-titles {
      display: flex;
      flex-direction: column;
    }
    .header h1 { 
      font-size: 52px; 
      font-weight: 900; 
      color: #0b2b3c; 
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }
    .header h1 span {
      color: #88c542;
    }
    .header .subtitle {
      font-size: 26px;
      color: #5c727d;
      font-weight: 700;
      margin-top: 6px;
    }
    .status-badge {
      background-color: #eaf6de;
      color: #4b801a;
      border: 3px solid #88c542;
      padding: 14px 30px;
      border-radius: 40px;
      font-weight: 800;
      font-size: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Cards Grid - Expanded for TV Height */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px;
      margin: 40px 0;
      flex-grow: 1;
    }

    .card {
      background: #ffffff;
      border-radius: 32px;
      padding: 50px 30px;
      text-align: center;
      border: 2px solid #e1e8ed;
      box-shadow: 0 20px 40px rgba(11, 43, 60, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
      background: #88c542;
    }

    .card .icon { font-size: 90px; margin-bottom: 15px; }
    .card .value { font-size: 85px; font-weight: 900; color: #0b2b3c; margin: 10px 0; line-height: 1.1; }
    .card .value.green { color: #88c542; }
    .card .label { font-size: 30px; color: #0b2b3c; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 10px; }
    .card .subtext { font-size: 24px; color: #5c727d; margin-top: 12px; font-weight: 600; }

    /* Footer */
    .footer {
      text-align: center;
      color: #5c727d;
      font-size: 24px;
      font-weight: 700;
      padding-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-titles">
      <h1>HALTON <span>PROJECT ZERO</span></h1>
      <div class="subtitle">Halton Outdoor Centre Clean Energy Impact</div>
    </div>
    <div class="status-badge">
      <span>●</span> Live Generation
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="icon">☀️</div>
      <div class="value" id="pv-power">0 kW</div>
      <div class="label">Solar Power Now</div>
      <div class="subtext" id="daily-yield">0 kWh Generated Today</div>
    </div>

    <div class="card">
      <div class="icon">🌍</div>
      <div class="value green" id="co2-saved">0 kg</div>
      <div class="label">CO₂ Reduction</div>
      <div class="subtext">Lifetime Environmental Benefit</div>
    </div>

    <div class="card">
      <div class="icon">🌲</div>
      <div class="value green" id="trees-saved">0</div>
      <div class="label">Trees Planted</div>
      <div class="subtext">Impact Metric</div>
    </div>
  </div>

  <div class="footer">
    Live updates every 5 minutes • Halton Solar Array
  </div>

  <script>
    const API_KEY = "ac6140ac-ab43-4eaa-b5e7-76934270c33e"; 
    const DEVICE_SN = "603J3030447P009"; 
    const ESTIMATED_LIFETIME_KWH = 71458; 

    function animateValue(id, start, end, duration, decimals = 0, suffix = '') {
      const obj = document.getElementById(id);
      if (!obj) return;
      
      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        const easeOutProgress = 1 - Math.pow(1 - progress, 3);
        const currentValue = start + easeOutProgress * (end - start);
        
        const formattedNum = decimals > 0 
          ? currentValue.toFixed(decimals) 
          : Math.round(currentValue).toLocaleString();
          
        obj.innerText = formattedNum + suffix;
        
        if (progress < 1) {
          window.requestAnimationFrame(step);
        }
      };
      window.requestAnimationFrame(step);
    }

    async function fetchFoxESSData() {
      try {
        const response = await fetch('https://www.foxesscloud.com/op/v1/device/real/query', {
          method: 'POST',
          headers: {
            'token': API_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ "sn": DEVICE_SN })
        });

        const data = await response.json();
        
        let todayYield = 21.80;
        let pvPower = 14.7;
        let totalYield = ESTIMATED_LIFETIME_KWH;

        if (data && data.result && data.result.length > 0) {
          const result = data.result[0];
          
          if (result.pvPower !== undefined) pvPower = result.pvPower;
          if (result.todayYield !== undefined) todayYield = result.todayYield;
          if (result.generationTotal || result.cumulateYield) {
            totalYield = result.generationTotal || result.cumulateYield;
          }
        }

        const co2Kg = Math.round(totalYield * 0.997);
        const trees = co2Kg;

        animateValue('pv-power', 0, parseFloat(pvPower), 1800, 1, ' kW');
        animateValue('co2-saved', 0, co2Kg, 1800, 0, ' kg');
        animateValue('trees-saved', 0, trees, 1800, 0, '');

        document.getElementById('daily-yield').innerText = `${parseFloat(todayYield).toFixed(2)} kWh Generated Today`;

      } catch (err) {
        console.error('Updating with baseline values:', err);
        
        const co2Kg = Math.round(ESTIMATED_LIFETIME_KWH * 0.997);
        const trees = co2Kg;

        animateValue('pv-power', 0, 14.7, 1800, 1, ' kW');
        animateValue('co2-saved', 0, co2Kg, 1800, 0, ' kg');
        animateValue('trees-saved', 0, trees, 1800, 0, '');
      }
    }

    fetchFoxESSData();
    setInterval(fetchFoxESSData, 300000);
  </script>
</body>
</html>
