<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halton Tennis Solar Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b1329;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 50px;
      overflow: hidden;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #1e293b;
      padding-bottom: 25px;
    }
    .header h1 { font-size: 46px; font-weight: 700; color: #f8fafc; }
    .status-badge {
      background-color: #065f46;
      color: #34d399;
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 22px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 35px;
      margin: auto 0;
    }

    .card {
      background: #1e293b;
      border-radius: 24px;
      padding: 45px 30px;
      text-align: center;
      border: 1px solid #334155;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .card .icon { font-size: 72px; margin-bottom: 20px; }
    .card .value { font-size: 70px; font-weight: 800; color: #38bdf8; margin: 10px 0; }
    .card .value.green { color: #4ade80; }
    .card .label { font-size: 24px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .card .subtext { font-size: 18px; color: #64748b; margin-top: 12px; }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🎾 Halton Tennis Clean Energy</h1>
    <div class="status-badge">
      <span>●</span> Live Generation
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="icon">☀️</div>
      <div class="value" id="pv-power">14.7 kW</div>
      <div class="label">Solar Power Now</div>
      <div class="subtext" id="daily-yield">21.80 kWh Generated Today</div>
    </div>

    <div class="card">
      <div class="icon">🌍</div>
      <div class="value green" id="co2-saved">-- kg</div>
      <div class="label">CO₂ Offset</div>
      <div class="subtext">Lifetime Environmental Benefit</div>
    </div>

    <div class="card">
      <div class="icon">🌲</div>
      <div class="value green" id="trees-saved">--</div>
      <div class="label">Trees Equivalent</div>
      <div class="subtext">Planted Tree Impact</div>
    </div>
  </div>

  <div class="footer">
    Live updates every 5 minutes • Halton Solar Array
  </div>

  <script>
    // REPLACE THESE VALUES WITH YOUR FOXESS CREDENTIALS
    const API_KEY = "ac6140ac-ab43-4eaa-b5e7-76934270c33e"; 
    const DEVICE_SN = "603J3030447P009"; 

    async function fetchFoxESSData() {
      try {
        const response = await fetch('https://www.foxesscloud.com/op/v1/device/real/query', {
          method: 'POST',
          headers: {
            'token': API_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ "sn": DEVICE_SN })
        });

        const data = await response.json();
        if (data && data.result && data.result.length > 0) {
          const result = data.result[0];
          
          // Extract metrics
          const pvPower = (result.pvPower || 0).toFixed(1);
          const todayYield = (result.todayYield || 0).toFixed(2);
          const totalYield = result.generationTotal || 0; 

          // Standard carbon and tree equivalence ratios
          const co2Kg = Math.round(totalYield * 0.997);
          const trees = Math.round(co2Kg / 20);

          document.getElementById('pv-power').innerText = `${pvPower} kW`;
          document.getElementById('daily-yield').innerText = `${todayYield} kWh Generated Today`;
          document.getElementById('co2-saved').innerText = `${co2Kg.toLocaleString()} kg`;
          document.getElementById('trees-saved').innerText = `${trees.toLocaleString()}`;
        }
      } catch (err) {
        console.error('Error updating dashboard:', err);
      }
    }

    fetchFoxESSData();
    setInterval(fetchFoxESSData, 300000); // Auto-refreshes every 5 minutes
  </script>
</body>
</html>
